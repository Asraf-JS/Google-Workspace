name: Publish course site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      # The six course books are built here rather than committed, so git history
      # doesn't grow with every rebuild. Chromium lays out the PDFs; Ghostscript
      # compresses their screenshots.
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y ghostscript
      - run: npm run build:books
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run check && npm run build:site
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
        id: deployment
